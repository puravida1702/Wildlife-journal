@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F0E0C; --paper:#1A1815; --ink:#F1EADF; --muted:#A39A8B; --gold:#C9A867; --line:#332E27; --tint:#24211C;
    --btn:#F1EADF; --on-btn:#1A1815; --scrim:rgba(0,0,0,.65); --danger:#E58A7A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0E0C; --paper:#1A1815; --ink:#F1EADF; --muted:#A39A8B; --gold:#C9A867; --line:#332E27; --tint:#24211C;
  --btn:#F1EADF; --on-btn:#1A1815; --scrim:rgba(0,0,0,.65); --danger:#E58A7A; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.45;
  padding-block:12px 96px;
  padding-left:max(10px, env(safe-area-inset-left,0px));
  padding-right:max(10px, env(safe-area-inset-right,0px));
}
button,input{font:inherit; color:inherit; border-radius:0}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.label{font-family:var(--sans); font-size:12px; letter-spacing:.16em; text-transform:uppercase; font-weight:700}

/* framed page */
.app{
  position:relative; max-width:640px; margin:0 auto; background:var(--paper); border:1px solid var(--gold);
  padding:34px 24px 30px; display:flex; flex-direction:column; gap:22px;
}
.app::before{content:""; position:absolute; inset:6px; border:1px solid var(--gold); pointer-events:none}

/* header */
.top{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center}
.logo{
  width:92px; height:92px; border-radius:50%; background:var(--icon) center/cover no-repeat, #FBF2E9;
  box-shadow:0 0 0 3px var(--paper), 0 0 0 4px var(--gold); margin:4px 0 6px;
}
h1{font-family:var(--sans); font-weight:700; font-size:22px; line-height:1.2; letter-spacing:.22em; text-transform:uppercase; margin:0; text-wrap:balance}
.counts{font-family:var(--serif); font-style:italic; color:var(--muted); margin:0; font-size:18px; font-variant-numeric:tabular-nums}
.divider{display:flex; align-items:center; justify-content:center; gap:14px; width:100%; max-width:300px; color:var(--gold)}
.divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--gold)}
.divider i{display:block; width:9px; height:9px; background:var(--gold); transform:rotate(45deg)}
.heading{font-family:var(--sans); font-weight:700; font-size:14px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); text-align:center; margin:0}
.section{display:flex; flex-direction:column; align-items:center; gap:12px}

/* notice */
.notice{border:1px solid var(--line); background:var(--tint); padding:12px 14px; font-family:var(--serif); font-style:italic; color:var(--muted); font-size:16px}
.notice b{color:var(--ink); font-weight:600; font-style:normal}

/* tools */
.tools{display:flex; flex-direction:column; gap:12px}
.search{width:100%; border:1px solid var(--gold); background:var(--paper); padding:12px 14px; min-height:48px; font-size:16px}
.search::placeholder{color:var(--muted); font-family:var(--serif); font-style:italic}
.chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch}
.chip{flex:none; border:1px solid var(--ink); background:transparent; padding:8px 14px; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; min-height:38px}
.chip[aria-pressed="true"]{background:var(--btn); border-color:var(--btn); color:var(--on-btn)}

/* buttons */
.btn{
  font-family:var(--sans); font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  border:1px solid var(--ink); background:transparent; color:var(--ink); padding:14px 18px; min-height:48px; text-align:center;
}
.btn.solid{background:var(--btn); color:var(--on-btn)}
.btn.quiet{border-color:var(--line); color:var(--muted)}
.btn.danger{border-color:var(--danger); color:var(--danger)}

/* grid */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:22px 14px}
.card{background:none; border:0; padding:0; text-align:left; display:flex; flex-direction:column; gap:6px; min-width:0}
.ph{
  position:relative; aspect-ratio:4/5; width:100%; max-width:100%; overflow:hidden;
  background:var(--icon) center/58% no-repeat, #FBF2E9; box-shadow:inset 0 0 0 1px var(--line);
}
.ph img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.tag{position:absolute; left:8px; top:8px; background:var(--paper); color:var(--ink); padding:2px 9px}
.cname{font-weight:700; font-size:13px; letter-spacing:.08em; text-transform:uppercase; line-height:1.3; overflow-wrap:anywhere; margin-top:4px}
.sci{font-family:var(--serif); font-style:italic; color:var(--muted); font-size:16px; line-height:1.25; overflow-wrap:anywhere}
.meta{color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; line-height:1.35}
.more{align-self:center}
.empty{color:var(--muted); padding:28px 0; text-align:center; font-family:var(--serif); font-style:italic}

/* species list */
.list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.row{display:flex; align-items:center; gap:14px; padding:14px 0; border:0; border-bottom:1px solid var(--line); width:100%; background:none; text-align:left}
.row .grow{flex:1; min-width:0}
.row .n{font-weight:700; font-size:22px; font-variant-numeric:tabular-nums; color:var(--gold)}

/* bottom bar */
.bar{
  position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--btn); color:var(--on-btn);
  display:flex; padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px);
}
.navb{flex:1; min-width:0; background:none; border:0; border-bottom:3px solid transparent; color:inherit; font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; padding:20px 4px 17px; opacity:.8}
.navb[aria-pressed="true"]{opacity:1; border-bottom-color:var(--gold)}

/* sheet */
.overlay{position:fixed; inset:0; background:var(--scrim); display:flex; align-items:flex-end; justify-content:center; z-index:20}
.panel{
  background:var(--paper); border-top:2px solid var(--gold); width:100%; max-width:560px; max-height:92%; overflow-y:auto;
  padding-top:22px; padding-bottom:calc(26px + env(safe-area-inset-bottom,0px));
  padding-left:max(22px, env(safe-area-inset-left,0px)); padding-right:max(22px, env(safe-area-inset-right,0px));
  display:flex; flex-direction:column; gap:16px;
}
@media (min-width:640px){ .overlay{align-items:center} .panel{max-height:88%; border:1px solid var(--gold)} }
.panel .ph{aspect-ratio:4/3; background-size:34%}
.panel h2{font-family:var(--sans); font-size:18px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; line-height:1.3; margin:0; text-wrap:balance}
.panel .sci{font-size:18px}
.panel dl{margin:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.5fr); gap:14px 0}
.panel dt{font-family:var(--serif); font-style:italic; font-size:18px; letter-spacing:0; text-transform:none; font-weight:400; color:var(--muted); text-align:right; padding-right:18px}
.panel dd{margin:0; min-width:0; overflow-wrap:anywhere; border-left:1px solid var(--gold); padding-left:18px}
.panel .btnrow{display:flex; gap:8px; flex-wrap:wrap}
.panel .btnrow .btn{flex:1 1 140px}
.panel a{color:var(--ink); text-decoration:underline; text-decoration-color:var(--gold); text-underline-offset:4px; font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; align-self:center; padding:0 6px}
.field{display:flex; flex-direction:column; gap:6px}
.field input{border:1px solid var(--gold); background:var(--paper); padding:11px 12px; min-height:48px; width:100%}
.note{color:var(--muted); font-family:var(--serif); font-style:italic; margin:0}
input[type=file]{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none}
@media (prefers-reduced-motion:no-preference){ .card:hover .ph{filter:brightness(1.04)} }
/* detail sheet headings */
.sec{display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:4px}
.sec .gold{color:var(--gold); letter-spacing:.3em}
.sec .div{display:flex; align-items:center; justify-content:center; gap:14px; width:100%; max-width:260px}
.sec .div::before,.sec .div::after{content:""; flex:1; height:1px; background:var(--gold)}
.sec .div i{display:block; width:8px; height:8px; background:var(--gold); transform:rotate(45deg)}
.pill{display:inline-block; border:1px solid var(--gold); padding:2px 10px; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase}
/* species gallery */
.gal{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 12px}
.gitem{display:flex; flex-direction:column; gap:6px; min-width:0}
.gitem .ph{aspect-ratio:1/1}
.gact{display:flex; flex-direction:column; gap:6px}
.btn.sm{min-height:40px; padding:10px 12px}
.panel .list{margin:0}
/* zoom and crop */
.ph.zoomable{cursor:zoom-in}
.gitem .ph{aspect-ratio:4/5}
.panel > .ph{aspect-ratio:4/5; width:min(100%,320px); align-self:center; background-size:40%}
.gact{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.gact.stack{grid-template-columns:1fr}
.gact .btn{padding:10px 4px; letter-spacing:.1em}
.cropframe{position:relative; aspect-ratio:4/5; width:min(100%,320px); align-self:center; overflow:hidden; background:#FBF2E9; box-shadow:inset 0 0 0 1px var(--gold); touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none}
.cropframe.grab{cursor:grabbing}
.cropframe img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; display:block}
.field input[type=range]{padding:0; min-height:36px; border:0; background:none; accent-color:var(--gold)}
.lb{position:fixed; inset:0; z-index:30; background:rgba(8,7,6,.96); display:flex; flex-direction:column}
.lbscroll{flex:1; min-height:0; overflow:auto; display:flex; padding:12px; -webkit-overflow-scrolling:touch}
.lbscroll img{margin:auto; max-width:100%; max-height:100%; object-fit:contain; cursor:zoom-in; display:block}
.lb.zoomed .lbscroll img{max-width:none; max-height:none; width:260%; cursor:zoom-out}
.lbbar{display:flex; gap:8px; padding:12px; padding-bottom:calc(12px + env(safe-area-inset-bottom,0px)); padding-left:max(12px,env(safe-area-inset-left,0px)); padding-right:max(12px,env(safe-area-inset-right,0px))}
.lbbar .btn{flex:1; border-color:#F3EADF; color:#F3EADF}
.lbbar .btn.solid{background:#F3EADF; color:#1A1815}
</style>
</head>

        var r=indexedDB.open('wildlife-journal',1);
        r.onupgradeneeded=function(){r.result.createObjectStore('kv')};
        r.onsuccess=function(){res(r.result)};
        r.onerror=function(){res(null)};
      }catch(e){res(null)}
    });
    return dbp;
  }
  function get(k){
    return db().then(function(d){
      if(!d) return memory[k];
      return new Promise(function(res){
        try{var q=d.transaction('kv').objectStore('kv').get(k); q.onsuccess=function(){res(q.result)}; q.onerror=function(){res(undefined)}}
        catch(e){res(memory[k])}
      });
    });
  }
  function put(k,v){
    memory[k]=v;
    return db().then(function(d){
      if(!d) return;
      return new Promise(function(res){
        try{var t=d.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=res; t.onerror=res; t.onabort=res}
        catch(e){res()}
      });
    });
  }
  function drop(k){
    delete memory[k];
    return db().then(function(d){
      if(!d) return;
      return new Promise(function(res){
        try{var t=d.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete=res; t.onerror=res; t.onabort=res}
        catch(e){res()}
      });
    });
  }
  function saveObs(){ return put('obs',obs); }
  function saveExtras(){ return put('extras',extras); }
  function getPhoto(id){
    if(photoCache[id]!==undefined) return Promise.resolve(photoCache[id]);
    return get('photo:'+id).then(function(v){photoCache[id]=v||null; return photoCache[id]});
  }

  /* small DOM helper (text only, never HTML) */
  function h(tag,attrs){
    var el=document.createElement(tag);
    if(attrs) Object.keys(attrs).forEach(function(k){
      if(k==='class') el.className=attrs[k]; else if(k==='on') Object.keys(attrs.on).forEach(function(e){el.addEventListener(e,attrs.on[e])});
      else el.setAttribute(k,attrs[k]);
    });
    for(var i=2;i<arguments.length;i++){
      var c=arguments[i]; if(c==null||c===false) continue;
      el.appendChild(typeof c==='string'?document.createTextNode(c):c);
    }
    return el;
  }
  function sec(t){ return h('div',{class:'sec'},h('span',{class:'label gold'},t),h('div',{class:'div'},h('i'))); }
  function fmt(d){
    if(!d) return 'Date unknown';
    var p=d.split('-'); if(p.length<3) return d;
    var dt=new Date(+p[0],+p[1]-1,+p[2]);
    return isNaN(dt)?d:dt.toLocaleDateString('en',{day:'numeric',month:'short',year:'numeric'});
  }
  function safeUrl(u){return /^https:\/\//.test(u||'')?u:''}
  function binom(s){ var w=(s||'').split(' '); return w.length>2?w.slice(0,2).join(' '):(s||''); }
  function key(o){return binom(o.sci)||o.common||'Unknown'}
  function today(){var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

  /* picture box: own photo first, then the iNaturalist link, otherwise the logo placeholder */
  function cropCss(c){ return 'translate('+(c.px*100)+'%,'+(c.py*100)+'%) scale('+c.z+')'; }
  function srcOf(o){
    if(o.hasPhoto) return getPhoto(o.id).then(function(s){return s||o.image||''});
    return Promise.resolve(o.image||'');
  }
  function pic(o,onzoom){
    var box=h('div',{class:'ph'});
    if(onzoom){
      box.className='ph zoomable'; box.setAttribute('role','button'); box.setAttribute('tabindex','0'); box.setAttribute('aria-label','Zoom picture');
      box.addEventListener('click',onzoom);
      box.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onzoom(); } });
    }
    if(o.noPic && !o.hasPhoto) return box;
    function show(src,fallback){
      var im=new Image(); im.alt='';
      im.onload=function(){ if(o.crop) im.style.transform=cropCss(o.crop); box.appendChild(im); };
      im.onerror=function(){if(fallback) fallback()};
      im.src=src;
    }
    if(o.hasPhoto) getPhoto(o.id).then(function(src){ if(src) show(src); else if(o.image) show(o.image); });
    else if(o.image) show(o.image);
    if(o.sample) box.appendChild(h('span',{class:'tag label'},'Sample'));
    return box;
  }

  /* data views */
  function filtered(){
    var q=state.q.trim().toLowerCase();
    return obs.filter(function(o){
      if(state.taxon!=='all' && o.taxon!==state.taxon) return false;
      if(!q) return true;
      return (o.common+' '+o.sci+' '+o.place).toLowerCase().indexOf(q)>-1;
    }).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')});
  }
  function renderCounts(){
    var sp={}; obs.forEach(function(o){sp[key(o)]=1});
    var n=obs.length, s=Object.keys(sp).length;
    $('#counts').textContent=n+(n===1?' sighting':' sightings')+' · '+s+(s===1?' species':' species');
  }
  function renderChips(){
    var seen={}; obs.forEach(function(o){if(o.taxon) seen[o.taxon]=(seen[o.taxon]||0)+1});
    var box=$('#chips'); box.textContent='';
    function chip(val,label){
      box.appendChild(h('button',{class:'chip',type:'button','aria-pressed':String(state.taxon===val),on:{click:function(){state.taxon=val;state.limit=60;render()}}},label));
    }
    chip('all','All');
    Object.keys(seen).sort(function(a,b){return seen[b]-seen[a]}).forEach(function(t){chip(t,TAXA[t]||t)});
  }
  function renderJournal(v){
    var list=filtered();
    if(!list.length){ v.appendChild(h('p',{class:'empty'},obs.length?'Nothing matches this search.':'No sightings yet. Add one or import your iNaturalist file.')); return; }
    var grid=h('div',{class:'grid'});
    list.slice(0,state.limit).forEach(function(o){
      grid.appendChild(h('button',{class:'card',type:'button','aria-label':(o.common||o.sci)+', '+fmt(o.date),on:{click:function(){openDetail(o.id)}}},
        pic(o),
        h('span',{class:'cname'},o.common||o.sci||'Unknown'),
        o.common&&o.sci&&o.common!==o.sci?h('span',{class:'sci'},o.sci):null,
        h('span',{class:'meta'},fmt(o.date)+(o.place?' · '+o.place:''))
      ));
    });
    v.appendChild(grid);
    if(list.length>state.limit) v.appendChild(h('div',{style:'display:flex;justify-content:center;margin-top:18px'},
      h('button',{class:'btn more',type:'button',on:{click:function(){state.limit+=60;render()}}},'Show more ('+(list.length-state.limit)+')')));
  }
  function groups(){
    var map={};
    filtered().forEach(function(o){
      var k=key(o); var g=map[k]||(map[k]={key:k,sci:binom(o.sci),common:o.common,obs:[],last:''});
      g.obs.push(o); if((o.date||'')>g.last) g.last=o.date||'';
    });
    return Object.keys(map).map(function(k){return map[k]});
  }
  function pictures(k){
    var items=[];
    obs.filter(function(o){return key(o)===k && (o.hasPhoto || (o.image && !o.noPic))})
       .sort(function(a,b){return (b.date||'').localeCompare(a.date||'')})
       .forEach(function(o){ items.push({kind:'obs',id:o.id,o:o,date:o.date,pic:o}); });
    extras.filter(function(x){return x.key===k}).forEach(function(x){ items.push({kind:'x',id:x.id,x:x,date:x.date,pic:{id:x.id,hasPhoto:true,crop:x.crop}}); });
    return items;
  }
  function renderSpecies(v){
    var rows=groups().sort(function(a,b){return b.obs.length-a.obs.length||(a.common||a.sci).localeCompare(b.common||b.sci)});
    if(!rows.length){ v.appendChild(h('p',{class:'empty'},'Nothing matches this search.')); return; }
    var grid=h('div',{class:'grid'});
    rows.forEach(function(g){
      var pics=pictures(g.key), box=pics.length?pic(pics[0].pic):h('div',{class:'ph'});
      if(g.obs.length>1) box.appendChild(h('span',{class:'tag label'},'\u00d7'+g.obs.length));
      grid.appendChild(h('button',{class:'card',type:'button','aria-label':(g.common||g.sci)+', '+g.obs.length+' sightings',on:{click:function(){openSpecies(g.key)}}},
        box,
        h('span',{class:'cname'},g.common||g.sci),
        g.common&&g.sci&&g.common!==g.sci?h('span',{class:'sci'},g.sci):null,
        h('span',{class:'meta'},g.obs.length+(g.obs.length===1?' sighting':' sightings')+' \u00b7 '+pics.length+(pics.length===1?' picture':' pictures'))
      ));
    });
    v.appendChild(grid);
  }
  function render(){
    renderCounts(); renderChips();
    $('#tab-journal').setAttribute('aria-pressed',String(state.tab==='journal'));
    $('#tab-species').setAttribute('aria-pressed',String(state.tab==='species'));
    var v=$('#view'); v.textContent=''; $('#heading').textContent=state.tab==='journal'?'Recent sightings':'Species seen';
    if(state.tab==='journal') renderJournal(v); else renderSpecies(v);
    var nb=$('#notice');
    if(isSample && !nb.dataset.msg){ nb.hidden=false; nb.textContent=''; nb.appendChild(h('span',null,h('b',null,'Sample entries. '),'These show how the journal looks. Import your iNaturalist file to replace them with your own sightings.')); }
  }
  function say(msg){ var nb=$('#notice'); nb.dataset.msg='1'; nb.hidden=false; nb.textContent=msg; }

  /* sheet */
  function closeSheet(){ $('#overlay').hidden=true; $('#panel').textContent=''; }
  function openSheet(){ $('#overlay').hidden=false; var f=$('#panel').querySelector('input,button'); if(f) f.focus(); }
  $('#overlay').addEventListener('click',function(e){ if(e.target===this) closeSheet(); });
  document.addEventListener('keydown',function(e){ if(e.key!=='Escape') return; if(!$('#lb').hidden) closeLb(); else if(!$('#overlay').hidden) closeSheet(); });

  function shrink(file){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(file), im=new Image();
      im.onload=function(){
        var m=900, s=Math.min(1,m/Math.max(im.width,im.height));
        var c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.8));
      };
      im.onerror=function(){URL.revokeObjectURL(url); rej(new Error('image'))};
      im.src=url;
    });
  }
  function pickPhoto(cb){
    var inp=h('input',{type:'file',accept:'image/*','aria-label':'Choose a photo'});
    document.body.appendChild(inp);
    inp.addEventListener('change',function(){
      var f=inp.files&&inp.files[0]; document.body.removeChild(inp);
      if(f) shrink(f).then(cb).catch(function(){say('That file could not be read as a photo.')});
    });
    inp.click();
  }

  /* zoom (lightbox) and crop */
  function holder(t){ return t.kind==='x'?{id:t.x.id,hasPhoto:true}:t.o; }
  function getCrop(t){ return t.kind==='x'?t.x.crop:t.o.crop; }
  function setCrop(t,c){
    var tgt=t.kind==='x'?t.x:t.o;
    if(c) tgt.crop=c; else delete tgt.crop;
    return t.kind==='x'?saveExtras():saveObs();
  }
  var lbState={target:null,back:null};
  function closeLb(){ $('#lb').hidden=true; $('#lb').classList.remove('zoomed'); $('#lbimg').removeAttribute('src'); }
  function toggleZoom(){
    var lb=$('#lb'), sc=$('#lbscroll'); lb.classList.toggle('zoomed');
    if(lb.classList.contains('zoomed')){ setTimeout(function(){ sc.scrollLeft=(sc.scrollWidth-sc.clientWidth)/2; sc.scrollTop=(sc.scrollHeight-sc.clientHeight)/2; },30); }
    else { sc.scrollLeft=0; sc.scrollTop=0; }
  }
  function openLightbox(t,back){
    lbState.target=t; lbState.back=back;
    srcOf(holder(t)).then(function(src){
      if(!src) return;
      $('#lb').classList.remove('zoomed'); $('#lbimg').src=src; $('#lb').hidden=false; $('#lbclose').focus();
    });
  }
  $('#lbclose').addEventListener('click',closeLb);
  $('#lbimg').addEventListener('click',toggleZoom);
  $('#lbzoom').addEventListener('click',toggleZoom);
  $('#lbcrop').addEventListener('click',function(){ var t=lbState.target, b=lbState.back; closeLb(); if(t) cropPicture(t,b); });

  /* load a picture for cropping: sharpest version first, CORS-clean when the server allows it */
  function loadForCrop(o){
    return srcOf(o).then(function(src){
      if(!src) return null;
      var tries=[];
      if(/^data:/.test(src)) tries.push({url:src,cors:false});
      else {
        if(/\/medium\./.test(src)) tries.push({url:src.replace('/medium.','/large.'),cors:true});
        tries.push({url:src,cors:true});
        tries.push({url:src,cors:false});
      }
      return new Promise(function(res){
        (function next(i){
          if(i>=tries.length) return res(null);
          var im=new Image(); if(tries[i].cors) im.crossOrigin='anonymous';
          im.onload=function(){ res({img:im,clean:tries[i].cors||/^data:/.test(tries[i].url)}); };
          im.onerror=function(){ next(i+1); };
          im.src=tries[i].url;
        })(0);
      });
    });
  }

  function cropPicture(t,back){
    var p=$('#panel'); p.textContent='';
    var c0=getCrop(t), z=c0?c0.z:1, px=c0?c0.px:0, py=c0?c0.py:0, loaded=null;
    var frame=h('div',{class:'cropframe'}), im=new Image(); im.alt=''; im.draggable=false;
    frame.appendChild(im);
    var slider=h('input',{id:'crop-z',type:'range',min:'1',max:'4',step:'0.02',value:String(z),'aria-label':'Zoom'});
    var msg=h('p',{class:'note'},'Drag the picture to move it. Use the slider to zoom in. Save crop keeps only this part of the picture.');
    function limit(){ var m=(z-1)/2; px=Math.max(-m,Math.min(m,px)); py=Math.max(-m,Math.min(m,py)); }
    function apply(){ limit(); im.style.transform=cropCss({z:z,px:px,py:py}); }
    var drag=null;
    frame.addEventListener('pointerdown',function(e){ drag={x:e.clientX,y:e.clientY}; try{frame.setPointerCapture(e.pointerId)}catch(_){} frame.classList.add('grab'); });
    frame.addEventListener('pointermove',function(e){
      if(!drag) return; var r=frame.getBoundingClientRect();
      px+=(e.clientX-drag.x)/r.width; py+=(e.clientY-drag.y)/r.height; drag={x:e.clientX,y:e.clientY}; apply();
    });
    function end(){ drag=null; frame.classList.remove('grab'); }
    frame.addEventListener('pointerup',end); frame.addEventListener('pointercancel',end);
    slider.addEventListener('input',function(){ z=parseFloat(slider.value); apply(); });
    loadForCrop(holder(t)).then(function(r){ if(!r){ msg.textContent='This picture could not be loaded. Check your connection and try again.'; return; } loaded=r; im.src=r.img.src; apply(); });

    function bake(){
      /* cut the visible part out of the picture and keep it as the picture */
      var W=frame.clientWidth, H=frame.clientHeight, img=loaded.img, w=img.naturalWidth, h2=img.naturalHeight;
      var s0=Math.max(W/w,H/h2), vw=W/(s0*z), vh=H/(s0*z);
      var cx=w/2-(px*W)/(s0*z), cy=h2/2-(py*H)/(s0*z);
      var sx=Math.max(0,Math.min(w-vw,cx-vw/2)), sy=Math.max(0,Math.min(h2-vh,cy-vh/2));
      var ow=Math.min(1200,Math.round(vw)), oh=Math.round(ow*vh/vw);
      var cv=document.createElement('canvas'); cv.width=ow; cv.height=oh;
      cv.getContext('2d').drawImage(img,sx,sy,vw,vh,0,0,ow,oh);
      return cv.toDataURL('image/jpeg',0.88);
    }
    function keepPicture(data){
      var id=t.kind==='x'?t.x.id:t.o.id;
      return put('photo:'+id,data).then(function(){
        photoCache[id]=data;
        if(t.kind==='x'){ delete t.x.crop; return saveExtras(); }
        t.o.hasPhoto=true; t.o.noPic=false; delete t.o.crop; return saveObs();
      });
    }
    function save(){
      if(!loaded){ return; }
      if(z<=1.001){ back(); return; }
      var data=null;
      try{ data=bake(); }catch(e){ data=null; }
      if(data){ keepPicture(data).then(function(){ render(); back(); }); return; }
      /* the picture comes from iNaturalist and the browser would not let us cut it: keep the crop as the display frame */
      setCrop(t,{z:+z.toFixed(3),px:+px.toFixed(4),py:+py.toFixed(4)}).then(function(){
        render();
        msg.textContent='This iNaturalist picture cannot be cut permanently here, so the crop is saved as the displayed frame. To make it permanent, save the picture to your phone and add it with Add a picture.';
        savebtn.textContent='Back'; savebtn.onclick=function(){ back(); };
      });
    }
    var savebtn=h('button',{class:'btn solid',type:'button',on:{click:save}},'Save crop');
    p.appendChild(h('h2',null,'Crop picture'));
    p.appendChild(msg);
    p.appendChild(frame);
    p.appendChild(h('div',{class:'field'},h('label',{class:'label',for:'crop-z'},'Zoom'),slider));
    p.appendChild(h('div',{class:'btnrow'},
      savebtn,
      h('button',{class:'btn',type:'button',on:{click:function(){ z=1;px=0;py=0;slider.value='1';apply(); }}},'Reset'),
      h('button',{class:'btn quiet',type:'button',on:{click:function(){ back(); }}},'Cancel')));
    openSheet();
  }

  /* one species: all its pictures, add and remove */
  function openSpecies(k){
    var all=obs.filter(function(o){return key(o)===k}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')});
    if(!all.length){ closeSheet(); return; }
    var first=all[0], name=first.common||first.sci||'Unknown', sci=binom(first.sci);
    var pics=pictures(k);
    var p=$('#panel'); p.textContent='';
    p.appendChild(h('div',null,
      h('h2',null,name),
      sci&&sci!==name?h('div',{class:'sci'},sci):null));
    p.appendChild(h('p',{class:'note'},all.length+(all.length===1?' sighting':' sightings')+' \u00b7 '+pics.length+(pics.length===1?' picture':' pictures')));
    p.appendChild(h('div',{class:'btnrow'},
      h('button',{class:'btn solid',type:'button',on:{click:function(){
        pickPhoto(function(data){
          var id='x-'+Date.now();
          put('photo:'+id,data).then(function(){ photoCache[id]=data; extras.push({id:id,key:k,date:today()}); return saveExtras(); }).then(function(){render();openSpecies(k)});
        });
      }}},'Add a picture')));
    p.appendChild(sec('Pictures'));
    if(!pics.length) p.appendChild(h('p',{class:'note'},'No pictures yet. Tap Add a picture.'));
    var gal=h('div',{class:'gal'});
    pics.forEach(function(it){
      var act=h('div',{class:'gact'});
      var target=it.kind==='x'?{kind:'x',x:it.x}:{kind:'obs',o:it.o};
      function again(){ openSpecies(k); }
      function ask(){
        act.textContent=''; act.className='gact';
        act.appendChild(h('button',{class:'btn quiet sm',type:'button',on:{click:function(){ cropPicture(target,again); }}},'Crop'));
        var rm=h('button',{class:'btn quiet sm',type:'button'},'Remove');
        rm.addEventListener('click',function(){
          act.textContent=''; act.className='gact stack';
          act.appendChild(h('button',{class:'btn danger sm',type:'button',on:{click:function(){ removePic(it,k); }}},'Yes, remove'));
          act.appendChild(h('button',{class:'btn quiet sm',type:'button',on:{click:ask}},'Keep'));
        });
        act.appendChild(rm);
      }
      ask();
      gal.appendChild(h('div',{class:'gitem'},
        pic(it.pic,function(){ openLightbox(target,again); }),
        h('span',{class:'meta'},fmt(it.date)+(it.kind==='x'?' \u00b7 added by you':(it.o.place?' \u00b7 '+it.o.place.split(',')[0]:''))),
        act));
    });
    p.appendChild(gal);
    p.appendChild(sec('Sightings'));
    var ul=h('ul',{class:'list'});
    all.forEach(function(o){
      ul.appendChild(h('li',null,h('button',{class:'row',type:'button',on:{click:function(){openDetail(o.id)}}},
        h('span',{class:'grow'},
          h('span',{class:'cname',style:'display:block'},fmt(o.date)),
          h('span',{class:'meta',style:'display:block'},o.place||'Place unknown')))));
    });
    p.appendChild(ul);
    p.appendChild(h('div',{class:'btnrow'},h('button',{class:'btn quiet',type:'button',on:{click:closeSheet}},'Close')));
    openSheet();
  }
  function removePic(it,k){
    var done;
    if(it.kind==='x'){
      extras=extras.filter(function(x){return x.id!==it.id});
      done=drop('photo:'+it.id).then(function(){photoCache[it.id]=null}).then(saveExtras);
    } else {
      var o=it.o; o.noPic=true;
      var had=o.hasPhoto; o.hasPhoto=false;
      done=(had?drop('photo:'+o.id).then(function(){photoCache[o.id]=null}):Promise.resolve()).then(saveObs);
    }
    done.then(function(){render();openSpecies(k)});
  }

  function openDetail(id){
    var o=obs.filter(function(x){return x.id===id})[0]; if(!o) return;
    var p=$('#panel'); p.textContent='';
    var hasPic=(o.hasPhoto||o.image)&&!o.noPic;
    var photoBox=pic(o,hasPic?function(){ openLightbox({kind:'obs',o:o},function(){openDetail(o.id)}); }:null);
    var link=safeUrl(o.url);
    var coords=(o.lat&&o.lon)?(Number(o.lat).toFixed(4)+', '+Number(o.lon).toFixed(4)):'';
    p.appendChild(photoBox);
    p.appendChild(h('div',null,
      h('h2',null,o.common||o.sci||'Unknown'),
      o.common&&o.sci&&o.common!==o.sci?h('div',{class:'sci'},o.sci):null));
    var dl=h('dl',null,
      h('dt',{class:'label'},'Date'),h('dd',null,fmt(o.date)),
      o.place?h('dt',{class:'label'},'Place'):null,o.place?h('dd',null,o.place):null,
      coords?h('dt',{class:'label'},'Coordinates'):null,coords?h('dd',null,coords):null,
      o.taxon?h('dt',{class:'label'},'Group'):null,o.taxon?h('dd',null,h('span',{class:'pill'},TAXA[o.taxon]||o.taxon)):null);
    p.appendChild(sec('At a glance'));
    p.appendChild(dl);
    if(o.sample){
      p.appendChild(h('p',{class:'note'},'This is a sample entry. It disappears when you import your file or add a sighting.'));
    } else {
      if(o.image && !o.hasPhoto && !o.noPic) p.appendChild(h('p',{class:'note'},'If the iNaturalist picture does not appear here, use Add my photo to keep your own copy.'));
      var row=h('div',{class:'btnrow'});
      row.appendChild(h('button',{class:'btn solid',type:'button',on:{click:function(){
        pickPhoto(function(data){
          put('photo:'+o.id,data).then(function(){ photoCache[o.id]=data; o.hasPhoto=true; o.noPic=false; return saveObs(); }).then(function(){render();openDetail(o.id)});
        });
      }}},o.hasPhoto?'Replace my photo':'Add my photo'));
      if(hasPic) row.appendChild(h('button',{class:'btn',type:'button',on:{click:function(){ cropPicture({kind:'obs',o:o},function(){openDetail(o.id)}); }}},'Crop'));
      if(o.hasPhoto) row.appendChild(h('button',{class:'btn quiet',type:'button',on:{click:function(){
        drop('photo:'+o.id).then(function(){ photoCache[o.id]=null; o.hasPhoto=false; return saveObs(); }).then(function(){render();openDetail(o.id)});
      }}},'Remove photo'));
      p.appendChild(row);
      var del=h('div',{class:'btnrow'});
      var first=h('button',{class:'btn danger',type:'button'},'Delete sighting');
      first.addEventListener('click',function(){
        del.textContent='';
        del.appendChild(h('button',{class:'btn danger',type:'button',on:{click:function(){
          obs=obs.filter(function(x){return x.id!==o.id});
          drop('photo:'+o.id).then(saveObs).then(function(){closeSheet();render()});
        }}},'Yes, delete it'));
        del.appendChild(h('button',{class:'btn quiet',type:'button',on:{click:function(){openDetail(o.id)}}},'Keep it'));
      });
      del.appendChild(first);
      p.appendChild(del);
    }
    p.appendChild(h('div',{class:'btnrow'},h('button',{class:'btn',type:'button',on:{click:function(){openSpecies(key(o))}}},'All pictures of this species')));
    var bottom=h('div',{class:'btnrow center'});
    if(link) bottom.appendChild(h('a',{class:'edit',href:link,target:'_blank',rel:'noopener noreferrer'},'Open on iNaturalist'));
    bottom.appendChild(h('button',{class:'btn quiet',type:'button',on:{click:closeSheet}},'Close'));
    p.appendChild(bottom);
    openSheet();
  }

  /* add a sighting */
  $('#add').addEventListener('click',function(){
    var p=$('#panel'); p.textContent='';
    var photoData=null;
    var status=h('p',{class:'note'},'No photo chosen yet.');
    var f=h('form',{style:'display:flex;flex-direction:column;gap:14px'});
    function field(id,label,attrs){
      var inp=h('input',Object.assign({id:id,type:'text',autocomplete:'off'},attrs||{}));
      return h('div',{class:'field'},h('label',{class:'label',for:id},label),inp);
    }
    f.appendChild(h('h2',null,'Add a sighting'));
    f.appendChild(field('f-common','Name'));
    f.appendChild(field('f-sci','Scientific name (optional)'));
    f.appendChild(field('f-date','Date',{type:'date',value:today()}));
    f.appendChild(field('f-place','Place'));
    f.appendChild(h('div',{class:'btnrow'},
      h('button',{class:'btn',type:'button',on:{click:function(){pickPhoto(function(d){photoData=d;status.textContent='Photo ready.'})}}},'Choose photo'),status));
    f.appendChild(h('div',{class:'btnrow'},
      h('button',{class:'btn solid',type:'submit'},'Save'),
      h('button',{class:'btn quiet',type:'button',on:{click:closeSheet}},'Cancel')));
    f.addEventListener('submit',function(e){
      e.preventDefault();
      var common=$('#f-common').value.trim(), sci=$('#f-sci').value.trim();
      if(!common && !sci){ status.textContent='Enter a name first.'; $('#f-common').focus(); return; }
      var o={id:'own-'+Date.now(),date:$('#f-date').value,place:$('#f-place').value.trim(),sci:sci,common:common||sci,taxon:'',hasPhoto:!!photoData};
      if(isSample){obs=[];isSample=false;$('#notice').dataset.msg='';$('#notice').hidden=true;}
      obs.push(o);
      (photoData?put('photo:'+o.id,photoData).then(function(){photoCache[o.id]=photoData}):Promise.resolve()).then(saveObs).then(function(){closeSheet();render()});
    });
    p.appendChild(f);
    openSheet();
  });

  /* iNaturalist CSV import */
  function parseCSV(t){
    if(t.charCodeAt(0)===0xFEFF) t=t.slice(1);
    var rows=[],row=[],f='',q=false;
    for(var i=0;i<t.length;i++){
      var c=t[i];
      if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false } else f+=c; }
      else if(c==='"') q=true;
      else if(c===','){row.push(f);f=''}
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f);f='';rows.push(row);row=[] }
      else f+=c;
    }
    if(f!==''||row.length){row.push(f);rows.push(row)}
    return rows;
  }
  function importText(text){
    var rows=parseCSV(text);
    if(rows.length<2) throw new Error('empty');
    var ix={}; rows[0].forEach(function(n,i){ix[n.trim().toLowerCase()]=i});
    if(ix.scientific_name===undefined && ix.common_name===undefined) throw new Error('columns');
    function g(r,k){return ix[k]!==undefined?(r[ix[k]]||'').trim():''}
    var incoming=[], withImg=0;
    rows.slice(1).forEach(function(r){
      if(r.length<2) return;
      var sci=g(r,'scientific_name'), common=g(r,'common_name');
      if(!sci&&!common) return;
      var id=g(r,'id'), image=safeUrl(g(r,'image_url')), url=safeUrl(g(r,'url'));
      if(!url && /^\d+$/.test(id)) url='https://www.inaturalist.org/observations/'+id;
      if(image) withImg++;
      incoming.push({id:'inat-'+(id||incoming.length),date:g(r,'observed_on')||g(r,'time_observed_at').slice(0,10),place:g(r,'place_guess').replace(/^[A-Z0-9]{4,8}\+[A-Z0-9]{2,3},\s*/,''),
        lat:g(r,'latitude'),lon:g(r,'longitude'),sci:sci,common:eng(sci,common||sci),taxon:g(r,'iconic_taxon_name'),image:image,url:url});
    });
    if(!incoming.length) throw new Error('rows');
    var old={}; obs.forEach(function(o){ if(!o.sample) old[o.id]=o });
    incoming.forEach(function(o){ if(old[o.id]&&old[o.id].hasPhoto) o.hasPhoto=true; old[o.id]=o });
    obs=Object.keys(old).map(function(k){return old[k]});
    isSample=false;
    return {n:incoming.length,img:withImg};
  }
  $('#import').addEventListener('click',function(){$('#csv').click()});
  $('#csv').addEventListener('change',function(){
    var f=this.files&&this.files[0], inp=this; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var res=importText(String(r.result));
        saveObs().then(function(){
          state.limit=60; state.taxon='all'; state.q=''; $('#q').value='';
          say(res.n+' sightings imported.'+(res.img?' Pictures that come from iNaturalist links may not load inside this page. Open a sighting and tap Add my photo to keep your own copy.':''));
          render();
        });
      }catch(e){
        say('This file does not look like an iNaturalist export. It needs the columns scientific_name and common_name. Export again from inaturalist.org/observations/export.');
      }
      inp.value='';
    };
    r.onerror=function(){say('The file could not be read.')};
    r.readAsText(f);
  });

  $('#q').addEventListener('input',function(){state.q=this.value;state.limit=60;render()});
  $('#tab-journal').addEventListener('click',function(){state.tab='journal';render()});
  $('#tab-species').addEventListener('click',function(){state.tab='species';render()});

  /* start with the 81 imported sightings, then use saved edits if there are any */
  obs=DATA.map(fixName); render();
  Promise.all([get('obs'),get('extras')]).then(function(r){
    if(r[0]&&r[0].length) obs=r[0].map(fixName);
    if(r[1]&&r[1].length) extras=r[1];
    render();
  });
})();
</script>

if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
